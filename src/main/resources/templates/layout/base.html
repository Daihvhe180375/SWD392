<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' | ApartmentManagement' : 'ApartmentManagement'}">
        ApartmentManagement</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS tuỳ chỉnh -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

    <!-- ===== NAVBAR ===== -->
    <!-- Hiển thị navbar chỉ khi đã đăng nhập (session currentUser tồn tại) -->
    <nav class="navbar navbar-expand-lg navbar-dark" id="mainNavbar" th:if="${session.loggedUser != null}">
        <div class="container">
            <!-- Logo & Tên hệ thống -->
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/profile}">
                <div class="brand-icon">
                    <i class="fas fa-building"></i>
                </div>
                <span class="brand-text">ApartmentMgmt</span>
            </a>

            <!-- Toggle cho mobile -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu items -->
            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/profile}">
                            <i class="fas fa-user me-1"></i>Hồ Sơ
                        </a>
                    </li>
                </ul>

                <!-- Dropdown avatar phải -->
                <div class="dropdown" th:if="${session.loggedUser != null}">
                    <button class="btn btn-link nav-user-btn dropdown-toggle d-flex align-items-center gap-2"
                        type="button" data-bs-toggle="dropdown">
                        <!-- Avatar nhỏ trên navbar -->
                        <img th:if="${session.loggedUser.avatar != null and !#strings.isEmpty(session.loggedUser.avatar)}"
                            th:src="${session.loggedUser.avatar}" class="nav-avatar" alt="Avatar">
                        <div th:unless="${session.loggedUser.avatar != null and !#strings.isEmpty(session.loggedUser.avatar)}"
                            class="nav-avatar-placeholder">
                            <i class="fas fa-user"></i>
                        </div>
                        <span class="nav-username" th:text="${session.loggedUser.fullName}">Họ Tên</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li>
                            <div class="dropdown-header">
                                <small class="text-muted"
                                    th:text="'@' + ${session.loggedUser.username}">@username</small>
                            </div>
                        </li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li>
                            <a class="dropdown-item" th:href="@{/profile}">
                                <i class="fas fa-user me-2 text-primary"></i>Xem hồ sơ
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" th:href="@{/profile/edit}">
                                <i class="fas fa-edit me-2 text-info"></i>Chỉnh sửa
                            </a>
                        </li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li>
                            <a class="dropdown-item text-danger" th:href="@{/logout}">
                                <i class="fas fa-sign-out-alt me-2"></i>Đăng xuất
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
    <!-- ===== END NAVBAR ===== -->

    <!-- ===== NỘI DUNG TRANG ===== -->
    <!-- Fragment content được thay thế bởi từng trang cụ thể -->
    <div th:fragment="content">
        <!-- Nội dung trang sẽ được chèn vào đây qua th:replace -->
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
