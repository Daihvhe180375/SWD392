<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký | ApartmentManagement</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body class="auth-page">

    <!-- Nền gradient -->
    <div class="auth-bg">
        <div class="auth-shape auth-shape-1"></div>
        <div class="auth-shape auth-shape-2"></div>
        <div class="auth-shape auth-shape-3"></div>
    </div>

    <!-- Card đăng ký - rộng hơn trang login -->
    <div class="auth-wrapper auth-wrapper-wide">
        <div class="auth-card card shadow-lg">

            <!-- Header -->
            <div class="auth-card-header text-center">
                <div class="auth-logo mb-3">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h2 class="auth-title">Tạo Tài Khoản</h2>
                <p class="auth-subtitle">Đăng ký để trở thành cư dân của chúng tôi</p>
            </div>

            <div class="card-body p-4">
                <!-- Form đăng ký -->
                <form th:action="@{/register}" th:object="${registerForm}" method="post" novalidate>

                    <!-- Hàng 1: Họ và tên + Số điện thoại -->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="fullName" class="form-label fw-medium">
                                Họ và tên <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-id-card text-muted"></i></span>
                                <input id="fullName" type="text" th:field="*{fullName}"
                                    th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                                    class="form-control" placeholder="Nguyễn Văn A" autofocus>
                                <!-- Hiển thị lỗi validation -->
                                <div class="invalid-feedback" th:errors="*{fullName}">Lỗi họ tên</div>
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="phone" class="form-label fw-medium">Số điện thoại</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-phone text-muted"></i></span>
                                <input id="phone" type="text" th:field="*{phone}"
                                    th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"
                                    class="form-control" placeholder="0901234567">
                                <div class="invalid-feedback" th:errors="*{phone}">Lỗi SĐT</div>
                            </div>
                        </div>
                    </div>

                    <!-- Hàng 2: Tên đăng nhập -->
                    <div class="mb-3">
                        <label for="username" class="form-label fw-medium">
                            Tên đăng nhập <span class="text-danger">*</span>
                        </label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user text-muted"></i></span>
                            <input id="username" type="text" th:field="*{username}"
                                th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
                                class="form-control" placeholder="chỉ chữ, số và dấu gạch dưới">
                            <div class="invalid-feedback" th:errors="*{username}">Lỗi username</div>
                        </div>
                        <div class="form-text">3-50 ký tự, chỉ chứa chữ, số và dấu gạch dưới (_)</div>
                    </div>

                    <!-- Hàng 3: Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-medium">
                            Email <span class="text-danger">*</span>
                        </label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
                            <input id="email" type="email" th:field="*{email}"
                                th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" class="form-control"
                                placeholder="example@email.com">
                            <div class="invalid-feedback" th:errors="*{email}">Lỗi email</div>
                        </div>
                    </div>

                    <!-- Hàng 4: Password + Confirm Password -->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="password" class="form-label fw-medium">
                                Mật khẩu <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                                <input id="password" type="password" th:field="*{password}"
                                    th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                    class="form-control" placeholder="Ít nhất 6 ký tự">
                                <div class="invalid-feedback" th:errors="*{password}">Lỗi mật khẩu</div>
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="confirmPassword" class="form-label fw-medium">
                                Xác nhận mật khẩu <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                                <input id="confirmPassword" type="password" th:field="*{confirmPassword}"
                                    th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                                    class="form-control" placeholder="Nhập lại mật khẩu">
                                <div class="invalid-feedback" th:errors="*{confirmPassword}">Lỗi xác nhận</div>
                            </div>
                        </div>
                    </div>

                    <!-- Nút Đăng ký -->
                    <div class="d-grid mt-2">
                        <button type="submit" class="btn btn-primary btn-auth" id="submitBtn">
                            <i class="fas fa-user-plus me-2"></i>Tạo Tài Khoản
                        </button>
                    </div>
                </form>

                <!-- Link đến trang đăng nhập -->
                <div class="text-center mt-3">
                    <p class="mb-0 text-muted">
                        Đã có tài khoản?
                        <a th:href="@{/login}" class="text-primary fw-medium">Đăng nhập ngay</a>
                    </p>
                </div>
            </div>

            <div class="auth-card-footer text-center">
                <small class="text-muted">© 2026 ApartmentManagement System</small>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Spinner khi submit form
        document.querySelector('form').addEventListener('submit', function () {
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang xử lý...';
            btn.disabled = true;
        });
    </script>
</body>

</html>
