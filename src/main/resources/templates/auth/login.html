<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập | ApartmentManagement</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS tùy chỉnh -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body class="auth-page">

    <!-- Nền gradient với các hình trang trí -->
    <div class="auth-bg">
        <div class="auth-shape auth-shape-1"></div>
        <div class="auth-shape auth-shape-2"></div>
        <div class="auth-shape auth-shape-3"></div>
    </div>

    <!-- Card đăng nhập căn giữa màn hình -->
    <div class="auth-wrapper">
        <div class="auth-card card shadow-lg">

            <!-- Header card: Logo và tiêu đề -->
            <div class="auth-card-header text-center">
                <div class="auth-logo mb-3">
                    <i class="fas fa-building"></i>
                </div>
                <h2 class="auth-title">Chào mừng trở lại!</h2>
                <p class="auth-subtitle">Đăng nhập vào hệ thống quản lý chung cư</p>
            </div>

            <div class="card-body p-4">

                <!-- Thông báo đăng ký thành công (flash message từ Register) -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-4"
                    role="alert">
                    <i class="fas fa-check-circle me-2"></i>
                    <span th:text="${successMessage}">Thông báo</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Thông báo đăng xuất thành công -->
                <div th:if="${param.logout}" class="alert alert-info alert-dismissible fade show mb-4" role="alert">
                    <i class="fas fa-info-circle me-2"></i>
                    Bạn đã đăng xuất thành công.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Thông báo lỗi đăng nhập -->
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span th:text="${error}">Lỗi đăng nhập</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Form đăng nhập -->
                <form th:action="@{/login}" th:object="${loginForm}" method="post">

                    <!-- Trường Username -->
                    <div class="mb-3">
                        <label for="username" class="form-label fw-medium">Tên đăng nhập</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-user text-muted"></i>
                            </span>
                            <input id="username" type="text" class="form-control" th:field="*{username}"
                                placeholder="Nhập tên đăng nhập" autofocus>
                        </div>
                    </div>

                    <!-- Trường Password -->
                    <div class="mb-4">
                        <label for="password" class="form-label fw-medium">Mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-lock text-muted"></i>
                            </span>
                            <input id="password" type="password" class="form-control" th:field="*{password}"
                                placeholder="Nhập mật khẩu">
                            <!-- Nút show/hide mật khẩu -->
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword" tabindex="-1">
                                <i class="fas fa-eye" id="toggleIcon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Nút đăng nhập -->
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-auth">
                            <i class="fas fa-sign-in-alt me-2"></i>Đăng Nhập
                        </button>
                    </div>
                </form>

                <!-- Link đến trang đăng ký -->
                <div class="text-center">
                    <p class="mb-0 text-muted">
                        Chưa có tài khoản?
                        <a th:href="@{/register}" class="text-primary fw-medium">Đăng ký ngay</a>
                    </p>
                </div>
            </div>

            <!-- Footer card -->
            <div class="auth-card-footer text-center">
                <small class="text-muted">© 2026 ApartmentManagement System</small>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Chức năng hiện/ẩn mật khẩu
        document.getElementById('togglePassword').addEventListener('click', function () {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                toggleIcon.className = 'fas fa-eye';
            }
        });
    </script>
</body>

</html>
