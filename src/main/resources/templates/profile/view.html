<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Cá Nhân | ApartmentManagement</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body class="app-page">

    <!-- Nhúng Navbar từ layout chung -->
    <div th:replace="~{layout/base :: #mainNavbar}"></div>

    <!-- Nội dung trang -->
    <div class="container py-5">

        <!-- Flash message thành công (sau khi Edit Profile) -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${successMessage}">Thành công</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Tiêu đề trang -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="page-title mb-1">
                    <i class="fas fa-user-circle me-2 text-primary"></i>Hồ Sơ Cá Nhân
                </h1>
                <p class="text-muted mb-0">Thông tin tài khoản và cá nhân của bạn</p>
            </div>
            <!-- Nút góc trên phải -->
            <div class="d-flex gap-2">
                <a th:href="@{/home}" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left me-2"></i>Quay Lại
                </a>
                <a th:href="@{/profile/edit}" class="btn btn-primary">
                    <i class="fas fa-edit me-2"></i>Chỉnh Sửa Hồ Sơ
                </a>
            </div>
        </div>

        <div class="row g-4">

            <!-- Cột trái: Avatar và thông tin tóm tắt -->
            <div class="col-lg-4">
                <div class="card profile-card shadow-sm h-100">
                    <div class="card-body text-center p-4">

                        <!-- Avatar tròn 100px -->
                        <div class="profile-avatar-wrapper mb-3">
                            <img th:if="${user.avatar != null and !#strings.isEmpty(user.avatar)}"
                                th:src="${user.avatar}" class="profile-avatar" alt="Avatar">
                            <!-- Avatar mặc định nếu chưa có -->
                            <div th:unless="${user.avatar != null and !#strings.isEmpty(user.avatar)}"
                                class="profile-avatar-default">
                                <i class="fas fa-user"></i>
                            </div>
                        </div>

                        <!-- Họ tên -->
                        <h4 class="fw-bold mb-1" th:text="${user.fullName}">Họ Tên</h4>

                        <!-- Username -->
                        <p class="text-muted mb-2" th:text="'@' + ${user.username}">@username</p>

                        <!-- Badge Role với màu theo yêu cầu -->
                        <span class="badge role-badge role-admin" th:if="${user.role.roleName == 'Admin'}"
                            th:text="${user.role.roleName}">Admin</span>

                        <span class="badge role-badge role-staff" th:if="${user.role.roleName == 'Staff'}"
                            th:text="${user.role.roleName}">Staff</span>

                        <span class="badge role-badge role-resident" th:if="${user.role.roleName == 'Resident'}"
                            th:text="${user.role.roleName}">Resident</span>

                        <span class="badge role-badge role-manager" th:if="${user.role.roleName == 'Manager'}"
                            th:text="${user.role.roleName}">Manager</span>

                        <hr class="my-3">

                        <!-- Trạng thái tài khoản -->
                        <div class="d-flex justify-content-center align-items-center gap-2">
                            <span class="status-dot active" th:if="${user.isActive}"></span>
                            <span class="status-dot inactive" th:unless="${user.isActive}"></span>
                            <small th:text="${user.isActive} ? 'Tài khoản đang hoạt động' : 'Tài khoản bị khoá'"
                                th:class="${user.isActive} ? 'text-success' : 'text-danger'">
                                Trạng thái
                            </small>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Cột phải: Thông tin chi tiết -->
            <div class="col-lg-8">

                <!-- Card 1: Thông tin cá nhân -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header profile-section-header">
                        <h5 class="mb-0">
                            <i class="fas fa-address-card me-2"></i>Thông Tin Cá Nhân
                        </h5>
                    </div>
                    <div class="card-body p-4">
                        <div class="row g-3">

                            <div class="col-sm-6">
                                <label class="info-label"><i class="fas fa-user me-1"></i>Họ và tên</label>
                                <p class="info-value" th:text="${user.fullName}">-</p>
                            </div>

                            <div class="col-sm-6">
                                <label class="info-label"><i class="fas fa-envelope me-1"></i>Email</label>
                                <p class="info-value" th:text="${user.email}">-</p>
                            </div>

                            <div class="col-sm-6">
                                <label class="info-label"><i class="fas fa-phone me-1"></i>Số điện thoại</label>
                                <p class="info-value" th:text="${user.phone != null ? user.phone : 'Chưa cập nhật'}">-
                                </p>
                            </div>

                            <div class="col-sm-6">
                                <label class="info-label"><i class="fas fa-shield-alt me-1"></i>Phân quyền</label>
                                <p class="info-value" th:text="${user.role.roleName}">-</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Card 2: Thông tin tài khoản -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header profile-section-header">
                        <h5 class="mb-0">
                            <i class="fas fa-cog me-2"></i>Thông Tin Tài Khoản
                        </h5>
                    </div>
                    <div class="card-body p-4">
                        <div class="row g-3">

                            <div class="col-sm-6">
                                <label class="info-label"><i class="fas fa-at me-1"></i>Tên đăng nhập</label>
                                <p class="info-value">
                                    <code th:text="${user.username}">username</code>
                                </p>
                            </div>

                            <div class="col-sm-6">
                                <label class="info-label"><i class="fas fa-calendar-plus me-1"></i>Ngày tạo</label>
                                <p class="info-value"
                                    th:text="${user.createdDate != null ? #temporals.format(user.createdDate, 'dd/MM/yyyy HH:mm') : 'Không rõ'}">
                                    -
                                </p>
                            </div>

                            <div class="col-sm-6">
                                <label class="info-label"><i class="fas fa-clock me-1"></i>Đăng nhập gần nhất</label>
                                <p class="info-value"
                                    th:text="${user.lastLogin != null ? #temporals.format(user.lastLogin, 'dd/MM/yyyy HH:mm') : 'Chưa có dữ liệu'}">
                                    -
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Card 3: Thông tin Resident (chỉ hiện khi là Resident) -->
                <div class="card shadow-sm mb-4" th:if="${resident != null}">
                    <div class="card-header profile-section-header profile-section-resident">
                        <h5 class="mb-0">
                            <i class="fas fa-home me-2"></i>Thông Tin Cư Dân
                        </h5>
                    </div>
                    <div class="card-body p-4">
                        <div class="row g-3">

                            <div class="col-sm-6">
                                <label class="info-label"><i class="fas fa-id-badge me-1"></i>Số CMND/CCCD</label>
                                <p class="info-value"
                                    th:text="${resident.idCard != null ? resident.idCard : 'Chưa cập nhật'}">-</p>
                            </div>

                            <div class="col-sm-6">
                                <label class="info-label"><i class="fas fa-door-open me-1"></i>Số phòng</label>
                                <p class="info-value">
                                    <span class="apartment-badge"
                                        th:text="${resident.apartmentId != null ? resident.apartmentId : 'Chưa phân phòng'}">
                                        A101
                                    </span>
                                </p>
                            </div>

                            <div class="col-sm-6">
                                <label class="info-label"><i class="fas fa-calendar-check me-1"></i>Ngày chuyển
                                    vào</label>
                                <p class="info-value"
                                    th:text="${resident.moveInDate != null ? #temporals.format(resident.moveInDate, 'dd/MM/yyyy') : 'Chưa cập nhật'}">
                                    -
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Card 4: Thông tin Staff (chỉ hiện khi là Staff) -->
                <div class="card shadow-sm mb-4" th:if="${staff != null}">
                    <div class="card-header profile-section-header profile-section-staff">
                        <h5 class="mb-0">
                            <i class="fas fa-briefcase me-2"></i>Thông Tin Nhân Viên
                        </h5>
                    </div>
                    <div class="card-body p-4">
                        <div class="row g-3">

                            <div class="col-sm-6">
                                <label class="info-label"><i class="fas fa-calendar me-1"></i>Ngày tuyển dụng</label>
                                <p class="info-value"
                                    th:text="${staff.hireDate != null ? #temporals.format(staff.hireDate, 'dd/MM/yyyy') : 'Chưa cập nhật'}">
                                    -
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
