<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Nhân Viên | ApartmentManagement</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            margin: 0;
        }

        /* ===== SIDEBAR (Same as index.html) ===== */
        .sidebar {
            width: 260px;
            min-height: 100vh;
            background: linear-gradient(180deg, #1e1b4b 0%, #312e81 100%);
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            z-index: 100;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
        }

        .sidebar-brand {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .sidebar-brand-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
        }

        .sidebar-brand-text {
            color: white;
            font-weight: 700;
            font-size: 16px;
        }

        .sidebar-user {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .sidebar-avatar-placeholder {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .sidebar-user-name {
            color: white;
            font-weight: 600;
            font-size: 14px;
            line-height: 1.2;
        }

        .sidebar-user-role {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
        }

        .sidebar-nav {
            flex: 1;
            padding: 12px 0;
        }

        .sidebar-section-label {
            padding: 8px 20px 4px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
        }

        .sidebar-nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 20px;
            color: rgba(255, 255, 255, 0.75);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border-radius: 0;
            transition: all 0.2s;
            margin: 2px 8px;
            border-radius: 8px;
        }

        .sidebar-nav-item:hover {
            background: rgba(255, 255, 255, 0.12);
            color: white;
            transform: translateX(3px);
        }

        .sidebar-nav-item.active {
            background: rgba(255, 255, 255, 0.18);
            color: white;
        }

        .sidebar-nav-item .nav-icon {
            width: 20px;
            text-align: center;
            font-size: 15px;
        }

        .sidebar-footer {
            padding: 12px 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-logout {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 20px;
            color: rgba(255, 100, 100, 0.85);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .sidebar-logout:hover {
            background: rgba(255, 100, 100, 0.12);
            color: #ff6b6b;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            margin-left: 260px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            background: white;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e5e7eb;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
        }

        .topbar-title {
            font-size: 20px;
            font-weight: 700;
            color: #1e1b4b;
        }

        .page-body {
            padding: 32px;
            flex: 1;
        }

        /* Table styles */
        .card {
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .table thead th {
            background: #f9fafb;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #6b7280;
            border-top: none;
        }

        .table tbody td {
            vertical-align: middle;
            font-size: 14px;
        }

        .badge-role {
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 11px;
        }

        .role-Admin {
            background: #fee2e2;
            color: #991b1b;
        }

        .role-Manager {
            background: #fef3c7;
            color: #92400e;
        }

        .role-Staff {
            background: #dcfce7;
            color: #166534;
        }
    </style>
</head>

<body>
    <!-- ===== SIDEBAR ===== -->
    <div class="sidebar">
        <a class="sidebar-brand" th:href="@{/home}">
            <div class="sidebar-brand-icon"><i class="fas fa-building"></i></div>
            <span class="sidebar-brand-text">ApartmentMgmt</span>
        </a>

        <div class="sidebar-user">
            <img th:if="${user.avatar != null and !#strings.isEmpty(user.avatar)}" th:src="${user.avatar}"
                class="sidebar-avatar" alt="Avatar">
            <div th:unless="${user.avatar != null and !#strings.isEmpty(user.avatar)}"
                class="sidebar-avatar-placeholder"><i class="fas fa-user"></i></div>
            <div>
                <div class="sidebar-user-name" th:text="${user.fullName}">Họ Tên</div>
                <div class="sidebar-user-role" th:text="${user.role.roleName}">Role</div>
            </div>
        </div>

        <nav class="sidebar-nav">
            <div class="sidebar-section-label">Menu chính</div>
            <a th:href="@{/home}" class="sidebar-nav-item">
                <span class="nav-icon"><i class="fas fa-home"></i></span> Trang Chủ
            </a>
            <a th:href="@{/profile}" class="sidebar-nav-item">
                <span class="nav-icon"><i class="fas fa-user"></i></span> Hồ Sơ Cá Nhân
            </a>

            <div class="sidebar-section-label" style="margin-top:8px">Quản lý</div>
            <a th:href="@{/admin/staff}" class="sidebar-nav-item active">
                <span class="nav-icon"><i class="fas fa-users-cog"></i></span> Quản Lý Nhân Viên
            </a>
        </nav>

        <div class="sidebar-footer">
            <a th:href="@{/logout}" class="sidebar-logout">
                <span class="nav-icon"><i class="fas fa-sign-out-alt"></i></span> Đăng Xuất
            </a>
        </div>
    </div>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main-content">
        <div class="topbar">
            <div class="topbar-title">Quản Lý Nhân Viên</div>
            <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addStaffModal">
                <i class="fas fa-plus me-1"></i> Thêm Nhân Viên
            </button>
        </div>

        <div class="page-body">
            <div class="card bg-white">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-4">Nhân viên</th>
                                    <th>Email</th>
                                    <th>Số điện thoại</th>
                                    <th>Vai trò</th>
                                    <th>Ngày tuyển dụng</th>
                                    <th class="text-end pe-4">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="staffTableBody">
                                <!-- Data will be loaded via AJAX -->
                                <tr>
                                    <td colspan="6" class="text-center py-4 text-muted">Đang tải dữ liệu...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Thêm Nhân Viên -->
    <div class="modal fade" id="addStaffModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="addStaffForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Thêm Nhân Viên Mới</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Tên đăng nhập</label>
                            <input type="text" name="username" class="form-control" required minlength="3">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mật khẩu</label>
                            <input type="password" name="password" class="form-control" required minlength="6">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Họ và tên</label>
                            <input type="text" name="fullName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Số điện thoại</label>
                            <input type="text" name="phone" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ngày tuyển dụng</label>
                            <input type="date" name="hireDate" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Vai trò</label>
                            <select name="roleId" id="roleSelect" class="form-select" required>
                                <!-- Roles will be loaded via AJAX -->
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-primary">Lưu nhân viên</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal: Đổi Vai Trò -->
    <div class="modal fade" id="changeRoleModal" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <form id="changeRoleForm">
                    <input type="hidden" id="editStaffId">
                    <div class="modal-header">
                        <h5 class="modal-title">Đổi Vai Trò</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <select id="editRoleSelect" class="form-select" required></select>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary w-100">Cập nhật</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            loadRoles();
            loadStaff();

            // Set default date for hireDate
            document.querySelector('input[name="hireDate"]').valueAsDate = new Date();

            // Handle Add Staff
            document.getElementById('addStaffForm').onsubmit = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData.entries());
                data.roleId = parseInt(data.roleId);

                try {
                    const res = await fetch('/api/admin/staff', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    const result = await res.json();
                    if (res.ok) {
                        alert(result.message);
                        bootstrap.Modal.getInstance(document.getElementById('addStaffModal')).hide();
                        e.target.reset();
                        loadStaff();
                    } else {
                        alert('Lỗi: ' + (result.error || result.message));
                    }
                } catch (err) {
                    alert('Có lỗi xảy ra kết nối server');
                }
            };

            // Handle Change Role
            document.getElementById('changeRoleForm').onsubmit = async (e) => {
                e.preventDefault();
                const staffId = document.getElementById('editStaffId').value;
                const roleId = parseInt(document.getElementById('editRoleSelect').value);

                try {
                    const res = await fetch(`/api/admin/staff/${staffId}/role`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ roleId })
                    });
                    const result = await res.json();
                    if (res.ok) {
                        alert(result.message);
                        bootstrap.Modal.getInstance(document.getElementById('changeRoleModal')).hide();
                        loadStaff();
                    } else {
                        alert('Lỗi: ' + result.error);
                    }
                } catch (err) {
                    alert('Có lỗi xảy ra');
                }
            };
        });

        async function loadRoles() {
            const res = await fetch('/api/admin/roles');
            const roles = await res.json();
            const selects = [document.getElementById('roleSelect'), document.getElementById('editRoleSelect')];
            selects.forEach(s => {
                s.innerHTML = roles.map(r => `<option value="${r.roleId}">${r.roleName}</option>`).join('');
            });
        }

        async function loadStaff() {
            try {
                const res = await fetch('/api/admin/staff');
                if (!res.ok) {
                    console.error('Lỗi tải danh sách nhân viên:', res.status, await res.text());
                    return;
                }
                const staff = await res.json();
                const tbody = document.getElementById('staffTableBody');

                if (!staff || staff.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4">Chưa có nhân viên nào</td></tr>';
                    return;
                }

                tbody.innerHTML = staff.map(s => `
                    <tr>
                        <td class="ps-4">
                            <div class="d-flex align-items-center gap-3">
                                <div class="sidebar-avatar-placeholder" style="width:32px; height:32px; font-size:12px">
                                    ${(s.fullName || '?').charAt(0)}
                                </div>
                                <div>
                                    <div class="fw-semibold">${s.fullName || '-'}</div>
                                    <div class="text-muted small">@${s.username || ''}</div>
                                </div>
                            </div>
                        </td>
                        <td>${s.email || '-'}</td>
                        <td>${s.phone || '-'}</td>
                        <td><span class="badge-role role-${s.role ? s.role.roleName : ''}">${s.role ? s.role.roleName : '-'}</span></td>
                        <td>${s.hireDate ? new Date(s.hireDate).toLocaleDateString('vi-VN') : 'Chưa rõ'}</td>
                        <td class="text-end pe-4">
                            <button class="btn btn-outline-primary btn-sm" onclick="openChangeRoleModal(${s.staffId}, ${s.role ? s.role.roleId : 1})">
                                <i class="fas fa-user-tag"></i> Đổi quyền
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Lỗi khi tải danh sách nhân viên:', err);
            }
        }

        function openChangeRoleModal(staffId, currentRoleId) {
            document.getElementById('editStaffId').value = staffId;
            document.getElementById('editRoleSelect').value = currentRoleId;
            new bootstrap.Modal(document.getElementById('changeRoleModal')).show();
        }
    </script>
</body>

</html>
