# ==========================================
# Cấu hình kết nối SQL Server
# ==========================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ApartmentManagement;encrypt=false;trustServerCertificate=true;sendStringParametersAsUnicode=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==========================================
# Cấu hình JPA / Hibernate
# ==========================================
# DB đã tạo sẵn qua schema.sql, không tự tạo/sửa schema
spring.jpa.hibernate.ddl-auto=none
# In SQL ra console khi debug (tắt khi production)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Không cần chỉ dialect - Hibernate 6 tự nhận diện SQL Server
\
# ==========================================
# Cấu hình Thymeleaf
# ==========================================
# Tắt cache để reload template ngay khi dev
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ==========================================
# Cấu hình ứng dụng
# ==========================================
server.port=8080
spring.application.name=ApartmentManagement

# Tắt Spring Security auto user (vì chúng ta tự quản lý auth qua session)
spring.security.user.name=disabled
spring.security.user.password=disabled
